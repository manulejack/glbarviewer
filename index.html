<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>GLB VR Viewer</title>
    <link rel="icon" type="image/png" href="thumbnail_favicon-glb2.png">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Fredoka:wdth,wght@105.8,700&family=Limelight&display=swap" rel="stylesheet">

        <!-- Super Hands -->

  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.misc.min.js"></script>
  <!--<script src="https://unpkg.com/super-hands@^3.0.6/dist/super-hands.min.js"></script>  --> 
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: #FFFFFF;
      }
      #ui {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 10;
        /* background: rgba(255,255,255,0); */
        padding: 10px;
        border-radius: 6px;
        margin-left: 20px;
      }

      /* Logo */
      #logo {
        width: 200px;
        height: auto;
        margin-bottom: -20px;
        margin-left: -20px;
      }

      #title {
        font-family: "Bricolage Grotesque", sans-serif;
        font-optical-sizing: auto;
        font-weight: 800;
          font-variation-settings:
    "wdth" 100;
        font-style: normal;
        color: #000000;
        /* background: linear-gradient(to left bottom, #9b3ce8, #3386ef, #13bcec);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent; */
        
        font-size: 80px;
        letter-spacing: -1px;
        line-height: .85em;
        margin-top: 10px;
        margin-bottom: 5px;
      }

            #subtitle {
        font-family: "Bricolage Grotesque", sans-serif;
        font-optical-sizing: auto;
        font-weight: 800;
          font-variation-settings:
    "wdth" 100;
        font-style: normal;
        
        background: linear-gradient(to left bottom, #9b3ce8, #3386ef, #13bcec);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        
        font-size: 90px;
        letter-spacing: -1px;
        line-height: .85em;
        margin-top: 0px;
        margin-bottom: 10px;
      }
      
    #footer {
      font-size: 12px;
      margin-top: 20px;
    }

       /* Hide the real file input */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

       /* Custom file button */
    .Documents-btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: fit-content;
      height: 45px;
      border: none;
      padding: 0px 17px;
      border-radius: 5px;
      background: linear-gradient(to left bottom, #9b3ce8, #3386ef, #13bcec);
      gap: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }

      .folderContainer {
      width: 40px;
      height: fit-content;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
    }
    .fileBack {
      z-index: 1;
      width: 80%;
      height: auto;
    }
    .filePage {
      width: 50%;
      height: auto;
      position: absolute;
      z-index: 2;
      transition: all 0.3s ease-out;
    }

.fileFront {
      width: 85%;
      height: auto;
      position: absolute;
      z-index: 3;
      opacity: 0.95;
      transform-origin: bottom;
      transition: all 0.3s ease-out;
    }
    .Documents-btn .text {
      color: white;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin: 0;
    }
    .Documents-btn:hover .filePage {
      transform: translateY(-5px);
    }
    .Documents-btn:hover {
      background-color: rgb(58, 58, 94);
    }
    .Documents-btn:hover .fileFront {
      transform: rotateX(30deg);
    }

    </style>
  </head>

  <body>
    <div id="ui">
          <img src="./glb-logo-black.png" alt="Logo" id="logo" />

      
      <h1 id="title">VR Viewer</h1>
      <!-- <h2 id="subtitle">Viewer</h2> -->
      <p>Load a glb file from your headset, <br> then click on the VR button on the bottom <br> right corner of the page.</p>
      <p>You can use your controllers to rotate the model <br> by clicking with the right or left, <br>to rotate accordingly.</p>
      
      <input type="file" id="fileInput" accept=".glb" class="visually-hidden" />

      <button class="Documents-btn" id="loadBtn" type="button">
        <span class="folderContainer">
          <svg class="fileBack" width="146" height="113" viewBox="0 0 146 113" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 4C0 1.79086 1.79086 0 4 0H50.3802C51.8285 0 53.2056 0.627965 54.1553 1.72142L64.3303 13.4371C65.2799 14.5306 66.657 15.1585 68.1053 15.1585H141.509C143.718 15.1585 145.509 16.9494 145.509 19.1585V109C145.509 111.209 143.718 113 141.509 113H3.99999C1.79085 113 0 111.209 0 109V4Z" fill="url(#paint0_linear_117_4)"></path>
            <defs>
              <linearGradient id="paint0_linear_117_4" x1="0" y1="0" x2="72.93" y2="95.4804" gradientUnits="userSpaceOnUse">
                <stop stop-color="#a040fd"></stop>
                <stop offset="1" stop-color="#5f41f3"></stop>
              </linearGradient>
            </defs>
          </svg>
          <svg class="filePage" width="88" height="99" viewBox="0 0 88 99" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="88" height="99" fill="url(#paint0_linear_117_6)"></rect>
            <defs>
              <linearGradient id="paint0_linear_117_6" x1="0" y1="0" x2="81" y2="160.5" gradientUnits="userSpaceOnUse">
                <stop stop-color="white"></stop>
                <stop offset="1" stop-color="#686868"></stop>
              </linearGradient>
            </defs>
          </svg>
          <svg class="fileFront" width="160" height="79" viewBox="0 0 160 79" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0.29306 12.2478C0.133905 9.38186 2.41499 6.97059 5.28537 6.97059H30.419H58.1902C59.5751 6.97059 60.9288 6.55982 62.0802 5.79025L68.977 1.18034C70.1283 0.410771 71.482 0 72.8669 0H77H155.462C157.87 0 159.733 2.1129 159.43 4.50232L150.443 75.5023C150.19 77.5013 148.489 79 146.474 79H7.78403C5.66106 79 3.9079 77.3415 3.79019 75.2218L0.29306 12.2478Z" fill="url(#paint0_linear_117_5)"></path>
            <defs>
              <linearGradient id="paint0_linear_117_5" x1="38.7619" y1="8.71323" x2="66.9106" y2="82.8317" gradientUnits="userSpaceOnUse">
                <stop stop-color="#a040fd"></stop>
                <stop offset="1" stop-color="#5251f2"></stop>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <p class="text">Load GLB</p>
      </button>

      
      <div id="footer">
  © 2026 Emmanuel Azouvi
</div>
    </div>

    <a-scene vr-mode-ui="enabled: true">
  <a-entity
    id="rightHand"
    laser-controls="hand: right"
    oculus-touch-controls="hand: right"
    raycaster="objects: .interactable">
  </a-entity>
  
  <a-entity
    id="leftHand"
    laser-controls="hand: left"
    oculus-touch-controls="hand: left"
    raycaster="objects: .interactable">
  </a-entity>
      
      <a-entity
        id="model"
        position="0 0 -2"
        rotation="0 0 0"
        scale="1 1 1"
        class="interactable"

        >
      </a-entity>

      <a-camera position="0 1.6 0"></a-camera>

 <!-- Contrôleurs Meta Quest avec super hands -->

      
      <a-sky color="#FFFFFF"></a-sky>
    </a-scene>

    <script>
      const fileInput = document.getElementById("fileInput");
      const model = document.getElementById("model");
      const loadBtn = document.getElementById("loadBtn"); 

      const rightHand = document.getElementById("rightHand");
      const leftHand = document.getElementById("leftHand");

            // Clicking the styled button opens the hidden file input
      loadBtn.addEventListener("click", () => {
        fileInput.click();
      });

      fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        if (!file) return;

        const url = URL.createObjectURL(file);
        model.setAttribute("gltf-model", url);
      });

      

    
      // model.addEventListener("click", () => {
      //   const rotation = model.getAttribute("rotation");
      //   rotation.y += 15; // degrees per click
      //   model.setAttribute("rotation", rotation);
      // });

      // Right controller → rotate right
      rightHand.addEventListener("click", () => {
        const rotation = model.getAttribute("rotation");
        rotation.y += 15;
        model.setAttribute("rotation", rotation);
      });
      
      // Left controller → rotate left
      leftHand.addEventListener("click", () => {
        const rotation = model.getAttribute("rotation");
        rotation.y -= 15;
        model.setAttribute("rotation", rotation);
      });

       // --- Joystick-based movement ---
      let leftStick = { x: 0, y: 0 };
      let rightStick = { x: 0, y: 0 };

      leftHand.addEventListener("thumbstickmoved", (evt) => {
        leftStick.x = evt.detail.x;
        leftStick.y = evt.detail.y;
      });

      rightHand.addEventListener("thumbstickmoved", (evt) => {
        rightStick.x = evt.detail.x;
        rightStick.y = evt.detail.y;
      });

      const MOVE_SPEED = 10.0; // meters per second, tweak to taste
      const DEADZONE = 0.15;

            // Runs on every frame; timeDelta is in ms
      AFRAME.registerComponent("model-mover", {
        tick: function (time, timeDelta) {
          const dt = timeDelta / 1000;
          const pos = model.getAttribute("position");

          // Left stick Y → up/down
          if (Math.abs(leftStick.y) > DEADZONE) {
            pos.y -= leftStick.y * MOVE_SPEED * dt;
          }

                    // Left stick X → left/right strafe
          if (Math.abs(leftStick.x) > DEADZONE) {
            pos.x += leftStick.x * MOVE_SPEED * dt;
          }

          // Right stick Y → forward/backward
          if (Math.abs(rightStick.y) > DEADZONE) {
            pos.z -= rightStick.y * MOVE_SPEED * dt;
          }

          model.setAttribute("position", pos);
        }
      });

      document.querySelector("a-scene").setAttribute("model-mover", "");

    </script>
  </body>
</html>
